name: Build and Release

on:
  push:
    tags: [ 'v*', '[0-9]+.[0-9]+.[0-9]+*' ]  # Only build and release on version tags

permissions:
  contents: write  # Required for creating releases
  actions: read    # Required for downloading artifacts

jobs:
  check-tests:
    runs-on: ubuntu-latest
    outputs:
      tests-passed: ${{ steps.check.outputs.tests-passed }}
    steps:
    - name: Check if tests passed on this tag
      id: check
      run: |
        # Get the latest test workflow run for this commit
        COMMIT_SHA="${{ github.sha }}"
        echo "Checking tests for commit: $COMMIT_SHA"
        
        # Use GitHub API to check if tests passed for this commit
        TEST_STATUS=$(gh api repos/${{ github.repository }}/actions/runs \
          --jq ".workflow_runs[] | select(.head_sha == \"$COMMIT_SHA\" and .name == \"Test\") | .conclusion" \
          | head -1)
        
        echo "Test status: $TEST_STATUS"
        
        if [ "$TEST_STATUS" = "success" ]; then
          echo "tests-passed=true" >> $GITHUB_OUTPUT
        else
          echo "tests-passed=false" >> $GITHUB_OUTPUT
          echo "ERROR: Tests have not passed for this commit. Cannot proceed with release."
          exit 1
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check-tests
    runs-on: ${{ matrix.os }}
    if: needs.check-tests.outputs.tests-passed == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-13  # Intel runner (more stable than macos-latest)
            platform: macos
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Build executable
      run: python compile.py
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fortherekord-${{ matrix.platform }}
        path: dist/
        retention-days: 7

  release:
    needs: build  # Only release if builds succeed (tests already passed to trigger this workflow)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: fortherekord-windows
        path: windows-dist/
        
    - name: Download macOS artifacts  
      uses: actions/download-artifact@v4
      with:
        name: fortherekord-macos
        path: macos-dist/
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          windows-dist/fortherekord-windows.exe
          macos-dist/fortherekord-macos
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}