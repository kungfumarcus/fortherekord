name: Test

on:
  push:
    branches: [ main ]  # Run tests when code is merged to main
    tags: [ 'v*', '[0-9]+.[0-9]+.[0-9]+*' ]  # Run tests on version tags
  pull_request:
    branches: [ main ]  # Run tests on PRs to validate changes

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Run unit tests
      run: python -m pytest tests/unit/ -v --cov=src/fortherekord --cov-report=xml --cov-report=term
      
    - name: Run E2E tests  
      run: python -m pytest tests/e2e/ -v
      
    - name: Run DevOps tests (compilation, etc.)
      run: python -m pytest tests/devops/ -v
        
    - name: Upload coverage to Codecov (Ubuntu only)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false